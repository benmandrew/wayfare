# Builds the wayfare image and pushes it to Docker Hub, so `docker-compose.yml`
# can pull a published image rather than building one on every server.
#
# Pull requests build but do not push. That keeps the Dockerfile honest -- a
# broken build stage fails the PR rather than surfacing on the next release --
# without putting unreviewed images on Docker Hub.
#
# Two repository secrets are required:
#   DOCKERHUB_USERNAME  the Docker Hub account
#   DOCKERHUB_TOKEN     an access token from Docker Hub -> Account Settings ->
#                       Personal access tokens, with Read & Write scope.
#                       Not the account password.

name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: benmandrew/wayfare

# A second push to the same branch makes the first one's image irrelevant.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # buildx, for the layer cache. The stock docker builder cannot import or
      # export one.
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # mode=max, not the default min: the expensive work is in the
          # `tippecanoe` and `deps` stages, which compile from source and then
          # get discarded. min caches only the layers of the final image, so
          # every run would rebuild tippecanoe from scratch -- several minutes
          # each time. max keeps the intermediate stages too, and their cache
          # keys move only when the Dockerfile or pyproject.toml does.
          cache-from: type=gha
          cache-to: type=gha,mode=max
