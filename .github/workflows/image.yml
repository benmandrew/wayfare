# Builds the wayfare image and pushes it to Docker Hub, so `docker-compose.yml`
# can pull a published image rather than building one on every server.
#
# Only main and the `v*` tags cut from it publish. Everything else -- pull
# requests, feature branches, a manual run aimed at either -- builds and stops
# there. That keeps the Dockerfile honest, because a broken build stage fails the
# check rather than surfacing on the next release, without ever putting
# unreviewed code on Docker Hub.
#
# Nothing is published until `check.yml` is green, so there is no window in which
# an image on Docker Hub is newer than the last passing check. The gate sits on
# the `push` job rather than on `build`, which is what lets the Dockerfile build
# alongside the checks instead of after them: a pull request never publishes, so
# waiting for the check before building one bought nothing and cost 34s of every
# run. On a publishing run the `push` job rebuilds from the layer cache `build`
# just wrote, and only then pushes.
#
# The cost is unchanged from before: a red check hides the Dockerfile result for
# that run. It now surfaces sooner, because `build` no longer waits.
#
# Two repository secrets are required:
#   DOCKERHUB_USERNAME  the Docker Hub account
#   DOCKERHUB_TOKEN     an access token from Docker Hub -> Account Settings ->
#                       Personal access tokens, with Read & Write scope.
#                       Not the account password.

name: image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: benmandrew/wayfare
  # Nothing is published from anywhere but main and the release tags cut from it.
  # `on.push.branches` already keeps feature-branch pushes from triggering a run
  # at all, but that is not the whole story: workflow_dispatch fires on whatever
  # ref it is aimed at, so without this a manual run from a feature branch would
  # overwrite `latest` with unreviewed code. Gating the push itself, rather than
  # the trigger, is what makes that impossible.
  #
  # The `push` job repeats this expression in its `if` rather than reading it
  # from here. The `env` context is not available to a job-level `if`, only to a
  # step-level one, and a job guarded by an expression that is always empty runs
  # every time.
  PUBLISH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

# A second push to the same branch makes the first one's image irrelevant.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate. Its own file, so `check.yml` stays the one description of what
  # passing means and can still be dispatched on its own.
  check:
    uses: ./.github/workflows/check.yml

  # No `needs`, so this runs alongside `check` rather than behind it. It never
  # pushes; that is the `push` job's business.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # buildx, for the layer cache. The stock docker builder cannot import or
      # export one.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          # mode=max, not the default min: the expensive work is in the
          # `tippecanoe` and `deps` stages, which compile from source and then
          # get discarded. min caches only the layers of the final image, so
          # every run would rebuild tippecanoe from scratch -- several minutes
          # each time. max keeps the intermediate stages too, and their cache
          # keys move only when the Dockerfile or pyproject.toml does.
          #
          # Only the publishing runs write. A cache entry written from a pull
          # request lands in that request's own ref scope, where neither main nor
          # any other request can read it -- but it still counts against the
          # repository's 10 GB quota and evicts by least-recent use. Two
          # `build-essential` toolchains under mode=max make each entry large
          # enough that a few open requests would push out main's entry, which is
          # the one the release build depends on. Reading stays unconditional:
          # a pull request can read the default branch, so it gets tippecanoe for
          # free either way.
          cache-from: type=gha
          cache-to: ${{ env.PUBLISH == 'true' && 'type=gha,mode=max' || '' }}

  # Everything that touches Docker Hub, and the only job the check gates. It
  # needs `build` as well, so a Dockerfile that does not build is never the
  # thing a green check appears to bless.
  push:
    needs: [check, build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Reads the cache `build` wrote a moment ago and writes none of its own:
      # every layer is already there, so this resolves to a push rather than a
      # build. Re-running the action, rather than handing an image between the
      # two jobs, is what keeps that transfer out of the run -- the alternative
      # is an artifact uploaded and downloaded to move something both runners
      # can fetch from the layer cache for nothing.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
