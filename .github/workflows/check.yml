# Formatting, linting, types and tests, run in the same nix devShell a
# contributor gets from direnv. One environment definition, checked here rather
# than described here -- a CI-only Python setup would drift from flake.nix and
# the drift would surface as a green check on a broken shell.
#
# The suite needs no datasets and no Valhalla: tests/conftest.py holds a mini
# GTFS feed, and anything wanting the real thing is marked `slow` or `valhalla`.
#
# `image.yml` calls this workflow as the gate on its publish, so this file no
# longer answers `push` or `pull_request` itself. It would otherwise run twice
# on every event that reaches both -- a second full nix build and test suite for
# a result already known. The status check is therefore named `image / check`.

name: check

on:
  workflow_call:
  workflow_dispatch:

# Cancelling a superseded run is the caller's business now. A called workflow's
# `concurrency` is evaluated in the caller's context, so a group of its own here
# would be a second lever on the same runs: a manual dispatch of this file would
# cancel the check inside an in-flight `image` run on the same ref, and taking
# the check down takes the whole run with it.

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Without this the devShell closure -- python, cairo, tippecanoe, duckdb,
      # a gcc -- is fetched from cache.nixos.org on every run, measured at 14.5s
      # of a 127s run and the largest cost after the test suite itself. A cached
      # store still has to be unpacked, so it comes back at around 4s rather
      # than disappearing.
      #
      # Split into restore and save, rather than the one step that does both,
      # for the reason the Docker layer cache is split in `image.yml`: an entry
      # written from a pull request lands in that request's own ref scope, where
      # nothing else can read it, and still counts against the repository's
      # 10 GB quota. A nix store is around 1 GB, so a few open requests would
      # evict the entry that main and every other branch reads from. Reading
      # stays unconditional -- any ref can read the default branch's entry.
      - id: nix-cache
        uses: nix-community/cache-nix-action/restore@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-

      # The devShell installs into .venv with uv on first entry, and pycairo
      # has no wheel -- it compiles every time this cache misses. Keyed on
      # flake.lock as well as pyproject.toml because the interpreter moving
      # invalidates the built extension too.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'flake.lock') }}
          restore-keys: uv-${{ runner.os }}-

      # mypy from cold is 6s here and 0.2s warm, the smallest of the three
      # caches and the cheapest to keep. The key carries the commit sha because
      # `actions/cache` never overwrites a key that already exists: a key moving
      # only with pyproject.toml would freeze at whatever the first run wrote and
      # decay from there. mypy revalidates what it restores, so an entry from an
      # older commit is a speed-up and never a wrong answer.
      - uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}-
            mypy-${{ runner.os }}-

      # Separate steps so a failure names itself in the run summary, and
      # `!cancelled()` so one failing check does not hide the other three --
      # a formatting slip should not conceal a broken test. The first entry
      # builds the shell and .venv; the rest find both already there.
      - name: format (python)
        run: nix develop --command ruff format --check .

      - if: ${{ !cancelled() }}
        name: format (nix)
        run: nix develop --command nixfmt --check flake.nix

      - if: ${{ !cancelled() }}
        name: format (toml)
        run: nix develop --command taplo fmt --check

      - if: ${{ !cancelled() }}
        name: lint
        run: nix develop --command ruff check .

      # The two viewer pages hold around 3,000 lines of JavaScript inside `<script>`
      # tags, which no other step here reads. `--error-on-warnings` because Biome
      # exits zero on warnings by default, and a warning nothing fails on is a
      # warning nobody fixes -- the `info` findings stay advisory either way.
      # Formatting is off in `biome.jsonc`; this checks behaviour only.
      - if: ${{ !cancelled() }}
        name: lint (web)
        run: nix develop --command biome lint --error-on-warnings .

      # `wayfare/map.toml` against `wayfare/map.schema.json`, which is the same
      # check the editor shows inline through "Even Better TOML" -- both read
      # `.taplo.toml`. Nothing about a wrong shape in that file is an error at
      # run time: a mistyped layer name draws an empty layer and says nothing,
      # and an upper-case colour leaves a mode's ramp ending somewhere other
      # than the colour its own key promises. The relations the schema cannot
      # state -- an ascending scale, a sentinel inside the stripped list -- are
      # checked by `palette.load` and covered in `tests/test_palette.py`.
      - if: ${{ !cancelled() }}
        name: schema (toml)
        run: nix develop --command taplo lint

      # deploy/refresh.sh is the whole of the scheduled pipeline and the only
      # part of it that is shell. It runs unattended, under `set -euo pipefail`,
      # on a host that carries no checkout -- the file is vendored into Ansible
      # -- so a quoting slip surfaces as a refresh that stopped a week ago.
      # There is no test that runs it, and there cannot be one: it drives
      # `docker compose` against a Valhalla graph.
      - if: ${{ !cancelled() }}
        name: lint (shell)
        run: nix develop --command shellcheck deploy/refresh.sh

      # This file and `image.yml` call each other, so the things that go wrong are
      # a `needs` naming a job that moved and an `if:` expression that parses as a
      # truthy string. Both leave a green check on a step that did not run.
      - if: ${{ !cancelled() }}
        name: lint (workflows)
        run: nix develop --command actionlint

      # The image build is 15 minutes and runs only on a push to main, so a shell
      # slip in a `RUN` surfaces there rather than here. `.hadolint.yaml` turns off
      # the version-pinning advisories and states why.
      - if: ${{ !cancelled() }}
        name: lint (dockerfile)
        run: nix develop --command hadolint Dockerfile

      # Relative paths in the markdown, which is all of what there is to check: no
      # external URL in this repo is a link rather than a code span, so `--offline`
      # costs nothing and keeps a green check from depending on a third party being
      # up. Scoped to tracked files so it never walks `.venv` or `web/vendor`.
      # `xargs -0` rather than an unquoted `$(git ls-files)`, which is a word split
      # actionlint refuses through shellcheck's SC2046 -- it caught this step on the
      # commit that added it.
      - if: ${{ !cancelled() }}
        name: lint (links)
        run: >-
          git ls-files -z '*.md' | xargs -0
          nix develop --command lychee --offline --no-progress

      - if: ${{ !cancelled() }}
        name: types
        run: nix develop --command mypy

      # `-n auto` here rather than in pyproject.toml addopts: xdist takes 50s of
      # runner time down to around 25s, and costs a local run the per-test
      # progress and the readable traceback a failure gets debugged from. Only
      # the runner is worth that trade.
      #
      # The suite parallelises because nothing in it shares state: every fixture
      # is tmp_path-scoped, and the one module-scoped fixture, in
      # test_query_spec.py, is read-only. The tests to look at first if this
      # ever turns flaky are the byte-identical render comparisons in
      # test_art.py, which are what the ORDER BY tiebreak rule in CLAUDE.md
      # exists to protect.
      #
      # `--cov` rides along on this run rather than getting one of its own: the
      # badge check below needs a report, and measuring it in a second full suite
      # costs another 25s of runner time for a number this run already has. The
      # figure is the same either way -- xdist's workers write separate data files
      # that coverage combines, measured at 93.85% both serial and under `-n auto`.
      - if: ${{ !cancelled() }}
        name: tests
        run: >-
          nix develop --command pytest -q -n auto
          --cov=wayfare --cov-report=json:coverage.json

      # The badge is a committed file, so nothing makes it wrong except a commit
      # that moves the number and leaves it behind. This is the step that says so,
      # and it reads the report above rather than re-running anything.
      - if: ${{ !cancelled() }}
        name: coverage badge
        run: >-
          nix develop --command
          python scripts/coverage_badge.py --check --json coverage.json

      # `web/palette.js` is generated from `wayfare/map.toml` and committed, so the
      # viewer can read it on a static host with no TOML parser and no extra fetch.
      # A colour edited in the TOML and not regenerated is a page painting the old
      # one, which nothing at run time can notice. Unlike the badge and the README
      # map this needs no data at all, so it is checked on every push.
      - if: ${{ !cancelled() }}
        name: palette
        run: >-
          nix develop --command
          python scripts/palette_js.py --check

      # After the checks, so a store that failed them is never the one the next
      # run starts from, and only from main for the quota reason above. The
      # primary-key hit is excluded because saving over an existing key is a
      # warning rather than a write. Garbage collection is what bounds the
      # entry: the store at this point holds the build-time closure as well as
      # the runtime one, and only the runtime one is worth carrying forward.
      - if: >-
          ${{ !cancelled()
          && github.ref == 'refs/heads/main'
          && steps.nix-cache.outputs.hit-primary-key != 'true' }}
        name: save nix store
        uses: nix-community/cache-nix-action/save@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          gc-max-store-size-linux: 1G
