<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="96" height="20" role="img" aria-label="coverage: 94%">
  <title>coverage: 94%</title>

  <linearGradient id="smooth" x2="0" y2="100%">
    <stop offset="0" stop-color="#bbb" stop-opacity=".1"/>
    <stop offset="1" stop-opacity=".1"/>
  </linearGradient>

  <mask id="round">
    <rect width="96" height="20" rx="3" fill="#fff"/>
  </mask>

  <g mask="url(#round)">
    <rect width="60" height="20" fill="#555"/>
    <rect x="60" width="36" height="20" fill="#97ca00"/>
    <rect width="96" height="20" fill="url(#smooth)"/>
  </g>

  <g fill="#fff" text-anchor="middle"
     font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">
    <text x="30" y="15" fill="#010101" fill-opacity=".3">coverage</text>
    <text x="30" y="14">coverage</text>
    <text x="78" y="15" fill="#010101" fill-opacity=".3">94%</text>
    <text x="78" y="14">94%</text>
  </g>
</svg>
