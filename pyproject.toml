[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayfare"
version = "0.1.0"
description = "Public transport routes across Great Britain and Ireland"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "duckdb>=1.1",
]

[project.optional-dependencies]
art = ["pycairo>=1.26", "numpy>=1.26", "pyarrow>=17"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[project.scripts]
wayfare = "wayfare.cli:main"

[tool.setuptools.packages.find]
include = ["wayfare*"]

# `map.toml` is read at run time, not only by the generator: `coverage.draw` takes
# its layer names and its ramps from it. Without this it is left out of the wheel
# and `wayfare draw` fails on an installed copy while working from a checkout.
[tool.setuptools.package-data]
wayfare = ["map.toml"]

[tool.ruff]
line-length = 92

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "A",
    "C4",
    "DTZ",
    "ERA",
    "FURB",
    "G",
    "ISC",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLW",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SLF",
]
# The rest of pylint is deliberately out: `PLR` is 285 magic-value comparisons and 48
# arity complaints, both of which read as noise against a codebase whose functions take
# a window and a spec. Of the rules inside the selected prefixes, these four are wrong
# here rather than merely unwelcome.
ignore = [
    # `config.py` re-exports the feed definitions as `X as X`, which is what makes them
    # public under mypy strict. The comment above that block says so.
    "PLC0414",
    # `pycairo`, `numpy` and `pyarrow` are the `art` extra, and the pipeline must import
    # without them. The lazy imports are the mechanism, not an oversight.
    "PLC0415",
    # `NoRoute`, `Malformed`, `Unauthorized`. The suffix carries nothing that the
    # `raise` site does not already say.
    "N818",
    # 82 sites, all audited, and the rule cannot see the distinction that matters.
    # This pipeline builds SQL from f-strings everywhere -- table names, closed
    # vocabularies of fragments, `db.pattern_id_sql` -- so the rule fires on the
    # normal way this code is written. The audit traced every one of the 82: the
    # `art.QuerySpec` closed-vocabulary claim in CLAUDE.md holds (every `/art`
    # request value is either checked against a dict of permitted keys or bound as
    # `?`), and the one site that spliced third-party text, `osmroutes.py`'s
    # `feed_version` from `feed_info.txt`, is now bound.
    #
    # Keeping it on would mean 82 `noqa`s, which is a rule nobody reads. Worse, its
    # heuristic skips `SET`, so it flagged none of the three sites that were
    # actually unescaped -- leaving it on would have bought a false sense of cover.
    # `db.sql_literal` is the answer for the statements that take no parameter.
    "S608",
]

[tool.ruff.lint.per-file-ignores]
# SLF001: a test reaching into a private is a test doing its job, and 125 of the 128
# sites are here. PT018: splitting a composite assertion gives a better failure message
# and costs the reader the one line that states the property; 30 sites, no defect among
# them.
"tests/*" = [
    "SLF001",
    "PT018",
    # A test asserts; that is the whole of what it does. 1,649 sites.
    "S101",
    # `/tmp/a.png` in `test_art.py` is a string handed to a format-detector, not a
    # path anything opens.
    "S108",
    # `urlopen` against the harness's own `127.0.0.1` server.
    "S310",
    # XML the test wrote itself, two lines further up.
    "S314",
    # `subprocess` running this repo's own generator script.
    "S603",
]

[tool.mypy]
python_version = "3.12"
# `scripts/` is otherwise unchecked. These three write files the README renders, two
# of which CI gates on, which is not code to leave to a runtime error.
files = [
    "wayfare",
    "scripts/coastline.py",
    "scripts/coverage_badge.py",
    "scripts/palette_js.py",
    "scripts/readme_map.py",
]
strict = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["duckdb.*", "cairo.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` on the path so shared builders are a normal import rather than a name
# that resolves only through pytest's rootdir insertion.
pythonpath = ["tests"]
# A leaked socket surfaces as an unraisable exception attributed to whichever test
# the collector happened to be running, which is how one went unnoticed. Promoting
# warnings to errors is what keeps the attribution honest.
filterwarnings = ["error"]

# `scripts/coverage_badge.py` reads `totals.percent_covered` off the JSON report, so
# the measurement is defined here rather than in the flags it passes: a run from the
# command line and the run behind the badge then count the same lines.
[tool.coverage.run]
source = ["wayfare"]

[tool.coverage.report]
# The pipeline's optional imports sit behind `if TYPE_CHECKING` and `__main__`
# guards, neither of which a test can reach, and counting them puts a fixed floor
# under the number that no test can lift.
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
