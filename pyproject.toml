[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wayfare"
version = "0.1.0"
description = "Public transport routes across Great Britain and Ireland"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "duckdb>=1.1",
]

[project.optional-dependencies]
art = ["pycairo>=1.26", "numpy>=1.26", "pyarrow>=17"]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests",
]

[project.scripts]
wayfare = "wayfare.cli:main"

[tool.setuptools.packages.find]
include = ["wayfare*"]

[tool.ruff]
line-length = 92

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["wayfare"]
strict = true
warn_return_any = false

[[tool.mypy.overrides]]
module = ["duckdb.*", "cairo.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` on the path so shared builders are a normal import rather than a name
# that resolves only through pytest's rootdir insertion.
pythonpath = ["tests"]
# A leaked socket surfaces as an unraisable exception attributed to whichever test
# the collector happened to be running, which is how one went unnoticed. Promoting
# warnings to errors is what keeps the attribution honest.
filterwarnings = ["error"]
